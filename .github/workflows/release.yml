name: Development Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set build number
        run: sed -i "s/undefined/$GITHUB_RUN_NUMBER/g" gradle.properties
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get version
        id: version
        run: |
          version=$(< build/tmp/version)
          main_version=`echo $version | cut -d '-' -f1`
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "main_version=$main_version" >> $GITHUB_OUTPUT
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts for ${{ steps.version.outputs.version }}
          path: build/libs/
      - name: Upload Release Jar
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: |
            build/libs/ScoreboardTools-${{ steps.version.outputs.version }}.jar
      - name: publish mod
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "ScoreboardTools v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          game-versions: 1.21.4
          version-type: release
          java: 21
          fail-mode: skip
          changelog: ${{ github.event.release.body }}
          loaders: fabric

          modrinth-id: t0xs6TI7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          files: |
            build/libs/ScoreboardTools-${{ steps.version.outputs.version }}.jar
            build/libs/ScoreboardTools-${{ steps.version.outputs.version }}-sources.jar