name: Development Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set build number
        run: sed -i "s/undefined/$GITHUB_RUN_NUMBER/g" gradle.properties
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Read gradle properties
        id: properties_v
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'platform'
      - name: Get version
        id: version
        run: |
          main_version=${{ steps.properties_v.outputs.mod_version }}
          version=$main_version+build.$GITHUB_RUN_NUMBER
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "main_version=$main_version" >> $GITHUB_OUTPUT
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts for ${{ steps.version.outputs.version }}
          path: build/libs/
