name: Development Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set build number
        run: sed -i "s/undefined/$GITHUB_RUN_NUMBER/g" gradle.properties
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get version
        id: version
        run: |
          version=$(< build/tmp/version)
          main_version=`echo $version | cut -d '-' -f1`
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "main_version=$main_version" >> $GITHUB_OUTPUT
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts for ${{ steps.version.outputs.version }} ${{ steps.version.outputs.main_version }}
          path: build/libs/
