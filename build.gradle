plugins {
	id 'fabric-loom' version "${loom_version}"
}

archivesBaseName = mod_name
version = "${mod_version}-mc${mc_version}"
group = project.maven_group

if (build_number != 'undefined') {
	version += "+build.${build_number}"
}

loom {
	mods {
		"scbt" {
			sourceSet sourceSets.main
		}
	}
	accessWidenerPath = file("src/main/resources/scbt.accesswidener")
}

repositories {
	maven {
		url 'https://masa.dy.fi/maven'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mc_version}"
	mappings "net.fabricmc:yarn:${mc_version}+build.${yarn_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fapi_version}+${mc_version}"

//	modImplementation "carpet:fabric-carpet:1.21-1.4.147+v240613"
	// Nullable修复
	modImplementation "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
	inputs.property "version", mod_version

	filesMatching("fabric.mod.json") {
		expand "version": mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${mod_name}"}
	}
}

tasks.register('genVersionFile') {
	file("$DEFAULT_BUILD_DIR_NAME/tmp").mkdirs()
	file("$DEFAULT_BUILD_DIR_NAME/tmp/version").text = version
}

build.finalizedBy('genVersionFile')